spring:
  application:
    name: auth.api

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres-service.customer.svc.cluster.local}:${DB_PORT:5432}/${DB_NAME:authdb}
    username: ${DB_USER:authuser}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  # 다국어 메시지(ko/en/zh/ja). fallback-to-system-locale을 끄지 않으면 지원하지 않는
  # 언어로 요청이 왔을 때 서버 JVM 로케일을 따라가버린다 — 항상 기본 번들(한국어)로 떨어뜨린다.
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

keycloak:
  url: ${KEYCLOAK_URL:http://keycloak-service.keycloak.svc.cluster.local}
  realm: ${KEYCLOAK_REALM:customer}
  client-id: ${KEYCLOAK_CLIENT_ID:auth-api-backend}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:}

app:
  frontend-base-url: ${FRONTEND_BASE_URL:https://customer.posselect.com}
  cookie-domain: ${COOKIE_DOMAIN:.posselect.com}
  cors-allowed-origin-pattern: ${CORS_ALLOWED_ORIGIN_PATTERN:https://*.posselect.com}
  mail-from: ${MAIL_FROM:customer-service@posselect.com}
  brand-name: ${BRAND_NAME:posselect.com}

sms:
  provider: solapi
  api-key: ${SMS_API_KEY:}
  api-secret: ${SMS_API_SECRET:}
  from-number: ${SMS_FROM_NUMBER:}

  # 발송 상한(auth.api#29). 전부 env 로 뺀다 — 조여야 할 때 재배포를 기다릴 수 없다.
  # 0 이하면 해당 검사가 꺼진다.
  #
  # 평시 상시 제한은 "번호당" 하나뿐이다(2026-08-22 사용자 결정). 전역 하드 캡은 지출을 묶는
  # 대신 자기 자신을 향한 DoS 가 된다 — 공격자가 전역 쿼터를 태우면 정상 가입자 전체가 막힌다.
  # 전역 값은 지우지 않고 비상 브레이크로 0(끔) 상태로 둔다. 공격이 관측되면 재배포 없이
  # SMS_GUARD_GLOBAL_BURST_LIMIT 부터 넣어 조인다(창이 짧아 반응이 가장 빠르다).
  # 평시 전역 방어는 차단이 아니라 관측이다 — sms.send.recorded 메트릭 + Grafana 알림.
  guard:
    per-number-daily-limit: ${SMS_GUARD_PER_NUMBER_DAILY_LIMIT:5}
    global-daily-limit: ${SMS_GUARD_GLOBAL_DAILY_LIMIT:0}
    global-burst-limit: ${SMS_GUARD_GLOBAL_BURST_LIMIT:0}
    daily-window: ${SMS_GUARD_DAILY_WINDOW:24h}
    burst-window: ${SMS_GUARD_BURST_WINDOW:10m}
    retention: ${SMS_GUARD_RETENTION:7d}
