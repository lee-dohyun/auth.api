# Claude 자동 PR 리뷰
#
# 전제: 저장소(또는 조직) 시크릿에 ANTHROPIC_API_KEY 가 등록되어 있어야 한다.
# 시크릿이 없으면 이 워크플로는 조용히 건너뛴다(아래 if 조건) — PR 자체를 막지는 않는다.
#
# 왜 ubuntu-latest 인가: 이 클러스터의 self-hosted runner(k3s-home)는 배포 전용이며
# 배포용 kubeconfig 에 접근할 수 있다. API 키를 그 러너에 올리면 노출면이 넓어지므로
# 리뷰 잡은 GitHub 호스티드 러너에서 돌린다.
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for API key
        id: guard
        run: |
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY 시크릿이 없어 Claude 리뷰를 건너뜁니다."
          fi
      - name: Claude review
        if: steps.guard.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            PR 변경분을 리뷰하라. 이 저장소는 Keycloak 위임 인증 API 다.
            
            우선 확인할 것:
            1. 스키마 변경이 Flyway 마이그레이션으로만 이뤄졌는가(ddl-auto 는 validate 다). 이미 적용된
               마이그레이션 파일을 수정하면 체크섬 불일치로 기동이 실패한다 — 항상 새 버전을 추가해야 한다.
            2. @Enumerated(STRING) enum 에 값을 추가했다면 CHECK 제약을 넓히는 ALTER 가 마이그레이션에 있는가.
            3. 로그인 전 호출되는 엔드포인트를 추가했다면 gateway 의 PUBLIC_EXACT_PATHS 에도 등록이 필요하다.
            4. 비밀번호/토큰/PII 가 로그에 평문으로 남지 않는가.
            
            확실한 결함만 지적할 것.
          claude_args: --model claude-sonnet-5 --max-turns 15
