plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.asciidoctor.jvm.convert' version '4.0.5'
}

group = 'com.dh'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('snippetsDir', file("build/generated-snippets"))
	// 이미지 스캔 경고 중 Boot 3.5.16 이 관리하는 버전보다 뒤에 수정본이 나온 것들(gateway#247).
	// Boot 를 올려 관리 버전이 이 값을 넘어서면 해당 줄을 지운다 - 남겨 두면 오히려 낮은 버전에 묶인다.
	set('jackson-bom.version', '2.21.7')
	set('tomcat.version', '10.1.60')
	set('log4j2.version', '2.25.5')
	set('postgresql.version', '42.7.12')
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'com.googlecode.libphonenumber:libphonenumber:9.0.37'
	// Solapi SMS 연동 SDK
	implementation 'net.nurigo:sdk:4.3.2'
	constraints {
		// nurigo sdk → okhttp 4.10.0 이 끌고 오는 okio 3.0.0 의 CVE-2023-3635 (gateway#247). okhttp 4.12 가 okio 3.6 을 쓰므로 3.x 안에서 올려도 호환된다.
		implementation 'com.squareup.okio:okio:3.18.2'
	}
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// admin.front 가 보내는 Keycloak staff realm JWT 를 직접 검증한다(AdminJwtVerifier).
	// 고객 로그인에 쓰는 customer realm 과는 별개 경로다.
	implementation 'com.nimbusds:nimbus-jose-jwt:9.37.4'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	outputs.dir snippetsDir
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

// 커버리지 리포트는 확인용일 뿐, 임계치 미달로 빌드를 실패시키지 않는다(대부분 저장소가
// 커버리지 0%에 가까운 상태에서 출발하므로 리포트만 남기고 게이트는 걸지 않기로 결정, auth.api#15).
jacocoTestReport {
	dependsOn test
	reports {
		xml.required = false
		html.required = true
	}
}

tasks.named('asciidoctor') {
	inputs.dir snippetsDir
	dependsOn test
}